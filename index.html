<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Between Skies - Gallery & Photobooth</title>
  <style>
    :root {
      --primary: #d4a373;
      --bg-gradient: linear-gradient(135deg, #fefae0 0%, #faedcd 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #283618;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    h1 { margin-bottom: 5px; color: #606c38; }
    .hashtag { font-weight: bold; color: var(--primary); margin-bottom: 25px; font-size: 1.1rem; }
    .booth-controls {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      margin: 5px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { background: #606c38; }
    
    /* Live Responsive Image Gallery Layout */
    .gallery-title { text-align: left; width: 100%; margin-top: 20px; border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 8px; }
    #photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
      margin-top: 15px;
    }
    .gallery-img-wrapper {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      aspect-ratio: 1 / 1;
      background: #eaeaea;
    }
    .gallery-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .gallery-img-wrapper img:hover { transform: scale(1.04); }
    .status-msg { color: #666; font-style: italic; padding: 20px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="container">
    <h1>In Between Skies</h1>
    <div class="hashtag">#InBetweenSkiesSJSU</div>

    <!-- Virtual Photobooth System Controls Interface -->
    <div class="booth-controls">
      <p>Welcome to the virtual photobooth exhibit. Take a photo to remember your visit!</p>
      <button class="btn" onclick="simulateCapture()">📸 Take a Photo</button>
      <div id="booth-actions" style="display:none; margin-top: 15px;">
        <button class="btn btn-secondary" onclick="resetBooth()">Retake</button>
        <button class="btn" onclick="alert('Photo downloaded directly to device memory.')">Download</button>
        <button class="btn" id="upload-btn" onclick="simulateUpload()">Add to Gallery</button>
      </div>
    </div>

    <!-- Live Synced Visual Display Area -->
    <h2 class="gallery-title">Exhibit Gallery Feed</h2>
    <div id="photo-gallery">
      <div class="status-msg">Loading exhibit memories...</div>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE THIS LINK VALUE WITH YOUR EXPLICIT DEPLOYED GOOGLE APPS SCRIPT URL LINK
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbWPBQohmFFGFSaLqBILRMDg-NTbw5BRUACZ3fa-67qa2SErlOeDkIKSD2XPt9yYME1A/execm"; 
    
    // Fallback simulation base64 placeholder data for testing local environment loops
    let capturedPhotoData = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=";

    // --- PHOTOBOOTH LOGIC INTERFACES ---
    function simulateCapture() {
      document.getElementById("booth-actions").style.display = "block";
      alert("Snapshot taken successfully! Choose 'Add to Gallery' to synchronize with the Google Drive database platform.");
    }

    function resetBooth() {
      document.getElementById("booth-actions").style.display = "none";
    }

    async function simulateUpload() {
      const uploadBtn = document.getElementById("upload-btn");
      uploadBtn.innerText = "Processing Sync...";
      uploadBtn.disabled = true;

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ image: capturedPhotoData })
        });
        const result = await response.json();
        
        if(result.id) {
          alert("Success! Image pushed to Google Drive and rendered inside live exhibit display frame.");
          resetBooth();
          syncVirtualGallery(); // Instantly update view elements layout
        } else {
          alert("Error encountered processing asset script parsing blocks: " + JSON.stringify(result));
        }
      } catch (err) {
        alert("Execution Error: Unable to complete cloud loop pipeline connection. View console diagnostics for data track dumps.");
        console.error(err);
      } finally {
        uploadBtn.innerText = "Add to Gallery";
        uploadBtn.disabled = false;
      }
    }

    // --- RECURSIVE DRIVE SYNC ENGINE ---
    async function syncVirtualGallery() {
      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();
        const galleryContainer = document.getElementById("photo-gallery");
        
        if (data.error) {
          console.error("Cloud Platform API Exception Message:", data.error);
          return;
        }

        // Empty current container view logic map grid track blocks
        if (!data.items || data.items.length === 0) {
          galleryContainer.innerHTML = '<div class="status-msg">No public snapshots shared yet. Be the first!</div>';
          return;
        }

        galleryContainer.innerHTML = ""; // Clear existing grid space allocations

        // Build responsive tracking elements map loop
        data.items.forEach(file => {
          const wrapper = document.createElement("div");
          wrapper.className = "gallery-img-wrapper";
          
          const img = document.createElement("img");
          // Leverages direct extraction architecture to pull media paths clean
          img.src = `https://google.com{file.id}`; 
          img.alt = "Exhibit Attendee Capture Memory Block";
          img.loading = "lazy"; 
          
          wrapper.appendChild(img);
          galleryContainer.appendChild(wrapper);
        });
      } catch (err) {
        console.error("Asynchronous UI pipeline network execution intercept failure notice:", err);
      }
    }

    // Initialize execution sequences automatically upon loading dashboard framework files
    syncVirtualGallery();

    // Loops background network checks every 5000ms (5 seconds) to clean up dropped/deleted assets
    setInterval(syncVirtualGallery, 5000);
  </script>
</body>
</html>
